# Importa el entorno y arranca Polar en orden, con AGS como recuperacion.
exec-once = bash ~/.config/hypr/scripts/start-desktop-shell.sh
exec-once = ~/.config/hypr/scripts/theme-sync.sh apply

# Autostart: solo apps ligeras de sesión
exec-once = bash -lc 'command -v nm-applet >/dev/null 2>&1 && nm-applet || true'
exec-once = blueman-applet

# Wallpaper
exec-once = ~/.config/hypr/scripts/start-wallpaper.sh

# Bootstrap de workspaces/apps por monitor:
# principal: ws 1..5 (code/build)
# secundario: ws 6..9 (docs/chat/music)
exec-once = HYPR_PRIMARY_MONITOR=DP-1 HYPR_SECONDARY_MONITOR=HDMI-A-1 ~/.config/hypr/scripts/bootstrap-workspaces.sh

# Snapshot persistente de ventanas (autosave + save final al cerrar sesión)
# Se inicia despues del restore para no pisar el estado previo con una sesion vacia.
exec-once = ~/.config/hypr/scripts/window-session-daemon.sh

# Arctic Instrument appearance, loaded by conf.d/30-decoration.conf.
# No monitor, input, animation or session settings.
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(79c7ffcc)
    col.inactive_border = rgba(29435a88)
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 16
        render_power = 3
        color = rgba(080d1466)
        color_inactive = rgba(080d1433)
    }

    glow {
        enabled = false
    }

    dim_special = 0.20

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        ignore_opacity = true
        xray = true
        noise = 0.01
        contrast = 1.0
        brightness = 1.0
        vibrancy = 0.08
        popups = true
        popups_ignorealpha = 0.20
    }
}
